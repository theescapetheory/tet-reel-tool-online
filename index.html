          ...rpk.map(x=>x.uhrzeit||''),
        ].filter(Boolean).map(z=>String(z).slice(0,5)));
        slots.filter(x=>!belegt.has(String(x).slice(0,5))).forEach(x=>e.push({z:x,h:`<div class="slot frei" ondragover="planUeber(event)" ondragleave="planRaus(event)" ondrop="planDrop(event,'${k}','${esc(x)}')" onclick="planEinplanen('${k}','${esc(x)}')"><span class="zeit">${esc(x)}</span> <span class="netz">frei — hier einplanen</span></div>`}));
        return e.sort((a,b)=>String(a.z).localeCompare(String(b.z))).map(x=>x.h).join('')})()}
      <button class="tagplus" onclick="planEinplanen('${k}')">+ einplanen</button></div>`}).join('')}</div>
  <div class="sec"><h2>Pflege</h2>
  <div class="row" style="gap:8px"><button class="btn ghost" onclick="planPflege('pp')">Postingplan bearbeiten</button><button class="btn ghost" onclick="planPflege('rp')">Redaktionsplan bearbeiten</button></div>
  <div id="ppBox" hidden style="margin-top:12px">
   <table id="ppTab"><tr><th>Tag</th><th>Wer</th><th>Format</th><th>Thema</th><th></th></tr>${(S.postingplan||[]).map(e=>ppZeile(e)).join('')}</table>
   <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost" onclick="ppZeileNeu()">+ Zeile</button><button class="btn" onclick="ppSpeichern()">Postingplan speichern</button><span class="meta" id="ppStatus"></span></div></div>
  <div id="rpBox" hidden style="margin-top:12px">
   <table id="rpTab"><tr><th>Datum</th><th>Format</th><th>Thema</th><th>Hook</th><th>CTA</th><th>Status</th><th>Einplanen</th></tr>
   ${rp.map((e,i)=>rpZeile(e,i)).join('')}</table>
   <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost" onclick="rpZeileNeu()">+ Zeile</button><button class="btn" onclick="rpSpeichern()">Redaktionsplan speichern</button><span class="meta" id="rpStatus"></span></div></div></div>
  <div class="sec"><h2>Eingeplant</h2>${(S.auftraege||[]).length?`<table><tr><th>Datum</th><th>Typ</th><th>Titel</th><th>Status</th></tr>${(S.auftraege||[]).slice().reverse().map(a=>`<tr style="cursor:pointer" onclick="planEintrag('${esc(a.unter||'')}')"><td>${esc(a.datum)} ${esc(a.uhrzeit||'')}</td><td>${esc(a.typ)}</td><td>${esc(a.thema||a.titel)}</td><td><span class="pill ${a.status==='gepostet'?'freigegeben':''}">${esc(a.status)}${a.metricool_id?' · '+esc(a.metricool_id):''}</span>${a.fehler?'<br><small style="color:var(--red)">'+esc(a.fehler)+'</small>':''}</td></tr>`).join('')}</table>`:'<p class="meta">–</p>'}</div>
  <div class="sec"><h2>Material zum Einplanen</h2><div id="matBox">lädt …</div></div>
  <div class="sec"><h2>Lauf-Protokoll</h2><pre id="joblog" class="log">–</pre></div>`;
}
async function vKpi(m){
  // Anne 14.09.: dienstags KPI-Meeting = App öffnen -> KPI -> alles da.
  m.innerHTML='<h1>KPI</h1><p class="meta">lädt …</p>';
  const d=await api('/api/kpi'); const posts=(d.posts||[]).slice().sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
  const snaps=d.snapshots||[]; const last=snaps[snaps.length-1]||{}; const prev=snaps[snaps.length-2]||{};
  const f=(x)=>x==null?'–':Number(x).toLocaleString('de-DE');
  const kwOf=(dt)=>{const x=new Date(dt);const t=new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y)/864e5)+1)/7)};
  const kw='KW'+kwOf(new Date()); const mw=(d.meeting||{})[kw]||{};
  // Anne 16.09.: „auf der KPI seite erwarte ich unsere Übersicht, die ich jeden Dienstag nutzen kann"
  // -> der echte Dienstags-Report, so wie er im Meeting läuft
  const fol=last.instagram?.followers, folPrev=prev.instagram?.followers;
  const week=posts.filter(p=>Date.now()-new Date(p.timestamp).getTime()<7*864e5);
  const sum=(arr,k)=>arr.reduce((a,p)=>a+(+p[k]||0),0);
  // Anne 17.09.: „farblich die KPI-Übersicht auf escape-studio anpassen, das sieht aus wie eine
  // eingepackte PDF." -> die vier Dienstags-Kennzahlen werden hier selbst gezeichnet, im Ton des
  // Tools; der vollständige Report bleibt als Link.
  const monat=new Date().toISOString().slice(0,7);
  const monatsPosts=posts.filter(p=>(p.timestamp||'').startsWith(monat));
  const monatsAnfang=(()=>{const vor=snaps.filter(x=>String(x.date||'')<monat+'-01');return vor.length?vor[vor.length-1]?.instagram?.followers:null})();
  const ziel=(wert,z)=>Math.max(0,Math.min(100,Math.round(100*(wert||0)/z)));
  const balken=(pz,farbe)=>`<div class="balken"><i style="width:${pz}%;background:${farbe}"></i></div>`;
  const gross=(nr,titel,wert,unter,pz,zieltext,farbe,text)=>`
    <div class="kpikarte" style="border-left-color:${farbe}">
      <span class="nr">${nr} · ${titel}</span>
      <b>${wert}</b>
      <span class="unter">${unter}</span>
      ${pz!=null?balken(pz,farbe)+`<div class="zielzeile"><span>${zieltext}</span><span>${pz} %</span></div>`:''}
      ${text?`<p class="kpitext">${text}</p>`:''}
    </div>`;
  const berichtHtml=`<div class="sec" style="border:0;padding:0;margin-bottom:6px">
    <div class="row" style="justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
      <h2 style="margin:0">Dienstags-Report${d.taeglich?.stand?` · Stand ${esc(String(d.taeglich.stand).replace('T',' ').slice(0,16))}`:''}</h2>
      ${d.bericht?`<a class="btn ghost" style="text-decoration:none" href="${d.bericht.url}" target="_blank">ganzen Report öffnen ↗</a>`:''}
    </div>
    <div class="kpikarten">
      ${gross(1,'Followerwachstum',f(fol),
        monatsAnfang!=null&&fol!=null?`${fol-monatsAnfang>=0?'▲ +':'▼ '}${f(fol-monatsAnfang)} im ${new Date().toLocaleDateString('de-DE',{month:'long'})}`:'',
        ziel(fol,10000),'Ziel 10.000','var(--camelbg)','')}
      ${gross(2,'Beiträge im Monat',f(monatsPosts.length),'Feed-Beiträge · Ziel 90',
        ziel(monatsPosts.length,90),'Ziel 90 / Monat','var(--yellow)','')}
      ${gross(3,'Leads aus Organic',f(mw.leads??0),'trägst du dienstags ein',null,null,'var(--yellow)','')}
      ${gross(4,'Kontakte in den Circle',f(mw.circle??0),mw.manychat?`davon ${f(mw.manychat)} über ManyChat`:'trägst du dienstags ein',null,null,'var(--camelbg)','')}
    </div>
    ${mw.notiz?`<div class="zuord" style="margin-top:12px">${esc(mw.notiz)}</div>`:''}
  </div>`
  m.innerHTML=`<h1>KPI</h1>${berichtHtml}
  
  <div class="kpi-grid">
   <div class="kpi"><span>Follower (Instagram)</span><b>${f(fol)}</b><span>${folPrev!=null&&fol!=null?(fol-folPrev>=0?'+':'')+f(fol-folPrev)+' zur Vorwoche':''}</span></div>
   <div class="kpi"><span>Leads aus Organic</span><input id="k_leads" type="number" value="${esc(mw.leads??'')}" placeholder="eintragen"></div>
   <div class="kpi"><span>Kontakte in den Circle</span><input id="k_circle" type="number" value="${esc(mw.circle??'')}" placeholder="eintragen"></div>
   <div class="kpi"><span>Umsatz aus Organic (€)</span><input id="k_umsatz" type="number" value="${esc(mw.umsatz??'')}" placeholder="eintragen"></div>
   <div class="kpi"><span>ManyChat-Kontakte</span><input id="k_manychat" type="number" value="${esc(mw.manychat??'')}" placeholder="eintragen"></div>
   <div class="kpi"><span>Notiz zum Dienstag</span><input id="k_notiz" type="text" value="${esc(mw.notiz??'')}" placeholder="optional"></div>
  </div>
  <div class="row"><button class="btn" onclick="kpiSpeichern('${kw}')">Meeting-Werte ${kw} speichern</button><span class="meta">${mw.stand?'zuletzt gespeichert '+esc(mw.stand.slice(0,16).replace('T',' ')):''}</span></div>
  <div class="kpi-grid" style="margin-top:18px">
   <div class="kpi"><span>Posts letzte 7 Tage</span><b>${week.length}</b></div>
   <div class="kpi"><span>Plays letzte 7 Tage</span><b>${f(sum(week,'videoPlayCount'))}</b></div>
   <div class="kpi"><span>Likes letzte 7 Tage</span><b>${f(sum(week,'likesCount'))}</b></div>
   <div class="kpi"><span>Kommentare letzte 7 Tage</span><b>${f(sum(week,'commentsCount'))}</b></div>
  </div>
  <div class="sec"><h2>Jeder Content einzeln</h2><div style="overflow-x:auto"><table><tr><th>Datum</th><th>Content</th><th>Typ</th><th>Plays</th><th>Views</th><th>Likes</th><th>Komm.</th><th>Dauer</th><th></th></tr>
  ${posts.map(p=>`<tr><td>${esc((p.timestamp||'').slice(0,10))}</td><td><b>${esc((p.caption||'').split('\n')[0].slice(0,70))}</b></td><td>${esc(p.productType||p.type||'')}</td><td>${f(p.videoPlayCount)}</td><td>${f(p.videoViewCount)}</td><td>${f(p.likesCount)}</td><td>${f(p.commentsCount)}</td><td>${p.videoDuration?Math.round(p.videoDuration)+' s':''}</td><td><a href="${esc(p.url||'#')}" target="_blank">öffnen</a></td></tr>`).join('')}</table></div>
  <div class="meta" style="margin-top:8px">Quelle: Apify-Profil-Scan (<code>_state/posts.json</code>, ${posts.length} Posts). Reichweite/Saves/Shares/Follows je Reel kommen über die Metricool-Routine, sobald sie Zahlen liefert (<code>_state/metricool-reels.json</code>).</div></div>
  <div class="sec"><h2>Konto-Verlauf</h2><table><tr><th>Datum</th><th>KW</th><th>Follower</th><th>Reichweite</th><th>Interaktionen</th></tr>${snaps.slice(-10).reverse().map(s=>`<tr><td>${esc(s.date||'')}</td><td>${esc(s.kw||'')}</td><td>${f(s.instagram?.followers)}</td><td>${f(s.instagram?.reach)}</td><td>${f(s.instagram?.interactions)}</td></tr>`).join('')}</table></div>`;
}
async function kpiSpeichern(kw){const werte={leads:+$('#k_leads').value||0,circle:+$('#k_circle').value||0,umsatz:+$('#k_umsatz').value||0,manychat:+$('#k_manychat').value||0,notiz:$('#k_notiz').value||''};const r=await post('/api/kpi-meeting',{kw,werte});toast(r.ok?'✓ Meeting-Werte '+kw+' gespeichert':'Fehler beim Speichern');}
function vLernen(){
  const reels=S.sessions.flatMap(s=>s.reels.filter(r=>r.viral).map(r=>({...r,session:s.id})));
  return `<h1>Lernen</h1>
  
  <table><tr><th>Reel</th><th>Format</th><th>Prognose</th><th>Plays</th><th>Likes</th><th>Komm.</th><th>Status</th></tr>${reels.map(r=>`<tr><td><b>${esc(r.titel)}</b><br><small class="hint">${esc(r.session)}</small></td><td>${esc(r.typ||'')}</td><td>${r.viral.score}</td><td>${r.kpi?.plays??'–'}</td><td>${r.kpi?.likes??'–'}</td><td>${r.kpi?.kommentare??'–'}</td><td><span class="pill ${esc(r.status)}">${esc(LABEL[r.status]||r.status)}</span></td></tr>`).join('')||'<tr><td colspan=7 class="sub">noch keine bewerteten Reels</td></tr>'}</table>
  <div class="sec"><h2>Playbook — reel-learnings.md</h2><textarea id="learn">${esc(S.learnings||'# Reel-Learnings\n\n(noch leer — der Analyst schreibt hier mit Belegzahlen, was trägt und was nicht)\n')}</textarea><div class="row" style="margin-top:8px"><button class="btn ghost" onclick="post('/api/learnings',{text:$('#learn').value}).then(()=>toast('gespeichert'))">Speichern</button></div></div>
  <div class="sec"><h2>Lauf-Protokoll</h2><pre id="joblog" class="log">–</pre><div id="claudeout" class="sub" style="margin-top:10px;white-space:pre-wrap"></div></div>`;
}
fetch('/api/state').then(r=>r.json()).then(s=>{S=s;HOME=(s.sessions[0]?.pfad||'').includes('/Users/')?'/Users/'+(s.sessions[0].pfad.split('/')[2]):'';render()});
// Anne 17.09.: „kann man das in den Hintergrund verlagern, ohne dass ich es so sehr spüre?"
// -> Im verborgenen Tab gar nicht abfragen; passiert lange nichts, wird der Takt gestreckt
//    (20 s -> bis 2 Min.); sobald sich etwas regt oder du zurueckkommst, wieder eng.
let takt=20000, stiller=0;
function taktLauf(){
  if(document.hidden){setTimeout(taktLauf,takt);return}
  const vorher=S?JSON.stringify(S):null;
  load().then(()=>{
    const jetzt=S?JSON.stringify(S):null;
    if(vorher===jetzt){stiller++; if(stiller>=3)takt=Math.min(120000,takt+20000)}
    else {stiller=0; takt=20000}
  }).catch(()=>{}).finally(()=>setTimeout(taktLauf,takt));
}
setTimeout(taktLauf,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){takt=20000;stiller=0;load()}});
</script>
</body>
