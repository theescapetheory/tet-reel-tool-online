<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>escape-studio · Material hochladen</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1526;--camel:#cdb08f;--yellow:#FDDF5B;--bg:#f6f7fb;--card:#fff;--line:#e6e8ef;--grey:#6b7280;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Jost,system-ui,sans-serif;color:var(--navy)}
header{display:flex;align-items:center;gap:12px;padding:18px 22px;background:var(--card);border-bottom:1px solid var(--line)}
header .brand{font-weight:800;letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--camel)}
header .brand::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:10px}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;margin:0 0 6px;font-weight:800}.sub{color:var(--grey);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 1px 0 rgba(13,21,38,.04)}
label{display:block;font-weight:600;margin-bottom:6px}.hint{color:var(--grey);font-size:13px;margin-top:6px}
input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
.drop{border:2px dashed #c9cedb;border-radius:14px;padding:26px;text-align:center;color:var(--grey);cursor:pointer;background:#fafbfe}
.drop.on{border-color:var(--yellow);background:#fffdf0}.drop b{color:var(--navy)}
.files{margin-top:10px;font-size:13px}.files div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.bar{height:8px;background:#eceef4;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s}
.btn{display:inline-block;font:inherit;font-weight:700;padding:13px 22px;border-radius:12px;border:0;background:var(--navy);color:#fff;cursor:pointer;width:100%;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.ok{background:#e8f8ee;border:1px solid #bfe8cf;border-radius:12px;padding:16px;margin-top:16px}
.err{color:var(--red);font-weight:600;margin-top:10px}
</style></head><body>
<header><div class="brand">escape-studio · Material hochladen</div></header>
<main>
<h1>Material hochladen</h1>


<div class="card">
  <label>Was lädst du hoch?</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <label style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer"><input type="radio" name="art" value="reel" checked> <b>Reel-Material</b></label>
    <label style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer"><input type="radio" name="art" value="story"> <b>Story-Material (Plan)</b></label>
    <label style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fffdf0"><input type="radio" name="art" value="heute"> <b>⚡ Story HEUTE</b></label>
  </div>
</div>

<div class="card">
  <label>1 · Hauptmaterial (ein oder mehrere Videos)</label>
  <div class="drop" id="dropV"><b>Videos hier ablegen</b> oder klicken</div>
  <input type="file" id="video" accept="video/*" multiple hidden>
  <div class="files" id="listV"></div>
</div>

<div class="card" id="cutterBlock">
  <label>2 · Zusatzmaterial</label>
  <div class="drop" id="dropZ"><b>Bilder, Slides, Screenshots</b> hier ablegen oder klicken</div>
  <input type="file" id="zusatz" accept="image/*,.pdf" multiple hidden>
  <div class="files" id="listZ"></div>
  <label style="margin-top:16px">3 · Notizen für den Cutter</label>
  <textarea id="notizen" placeholder="z. B. Bild bei 0:03 einblenden"></textarea>
  
</div>

<div class="card">
  <label>Absender</label>
  <input type="text" id="absender" placeholder="Dein Name oder Team">
  <div class="bar" id="bar" hidden><i></i></div>
  <div style="margin-top:14px"><button class="btn" id="senden" disabled>Hochladen</button></div>
  <div class="err" id="err"></div>
  <div class="ok" id="ok" hidden></div>
</div>
</main>
<script>
function cutterSicht(){const a=(document.querySelector('input[name=art]:checked')||{}).value;const b=document.getElementById('cutterBlock');if(b){b.hidden=(a==='heute');if(a==='heute'){zusatz=[];const l=document.getElementById('listZ');if(l)l.innerHTML='';const n=document.getElementById('notizen');if(n)n.value=''}}}
document.querySelectorAll('input[name=art]').forEach(r=>r.addEventListener('change',cutterSicht));
const KEY=new URLSearchParams(location.search).get('key')||'';
const $=(s)=>document.querySelector(s);
let videos=[], zusatz=[];
function bind(drop,input,onFiles){drop.onclick=()=>input.click();input.onchange=()=>onFiles([...input.files]);
 ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
 ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
 drop.addEventListener('drop',ev=>onFiles([...ev.dataTransfer.files]));}
const mb=(n)=>Math.round(n/1e6)+' MB';
// Groessengrenze des Relais. Vorher pruefen statt hinterher abbrechen: bis zum 28.09.2026
// lud man erst 3 GB hoch und bekam dann ein blankes „zu gross" — die Zeit war weg und
// niemand wusste, warum. Jetzt sieht man es beim Auswaehlen.
const MAX_BYTES = 3 * 1024 * 1024 * 1024;
const HINWEIS = (t, farbe) => `<div style="margin-top:10px;padding:10px 12px;border-radius:8px;line-height:1.45;background:${farbe==='rot'?'#fdecec':'#fff8e6'};border-left:4px solid ${farbe==='rot'?'#d03030':'#e0a500'};color:#2a2a2a">${t}</div>`;
// Mehrere Teile in EINER Lieferung (Anne 24.09. und 28.09.2026): Wer ein Reel aus mehreren
// Schnipseln gebaut haben will, waehlt sie hier zusammen aus. Sie bleiben ein Paket, in der
// Reihenfolge der Liste; der Mac verbindet sie zu einem Beitrag. Die Grenze gilt je Datei.
const istVideo=f=>/video|\.(mp4|mov|m4v)$/i.test(f.type+f.name);
function listeV(){
  const zuGross=videos.filter(f=>f.size>MAX_BYTES), summe=videos.reduce((a,f)=>a+f.size,0);
  let extra='';
  if(zuGross.length){
    extra = HINWEIS(`<b>${zuGross.length>1?'Diese Dateien sind':'Diese Datei ist'} zu gross:</b> ${zuGross.map(f=>f.name).join(', ')}. Das Hochladen geht bis ${mb(MAX_BYTES)} je Datei.<br>
      Schick sie stattdessen als <b>iCloud-Link</b> — in Fotos oder Dateien auf „Teilen" → „Link kopieren", und den Link hier ins Feld <b>Notizen</b> einsetzen. Dann holen wir das Video direkt bei Apple ab, ohne Groessengrenze.`,'rot');
  } else if(summe > 1.5*1024*1024*1024){
    extra = HINWEIS(`Grosse Lieferung (${mb(summe)}). Das kann ein paar Minuten dauern — lass die Seite bitte offen, bis der Balken durch ist.`,'gelb');
  }
  $('#listV').innerHTML = videos.map((f,i)=>`<div><span>${videos.length>1?(i+1)+' · ':''}${f.name}</span><span>${mb(f.size)} ${videos.length>1&&i>0?`<a href="#" onclick="hoch(${i});return false">↑</a> `:''}<a href="#" onclick="raus(${i});return false">✕</a></span></div>`).join('') + extra;
  $('#senden').disabled = !videos.length || zuGross.length>0;
}
function raus(i){videos.splice(i,1);listeV()}
function hoch(i){[videos[i-1],videos[i]]=[videos[i],videos[i-1]];listeV()}
bind($('#dropV'),$('#video'),fs=>{
  for(const f of fs.filter(istVideo)) if(!videos.some(v=>v.name===f.name&&v.size===f.size)) videos.push(f);
  $('#video').value=''; listeV();
});
bind($('#dropZ'),$('#zusatz'),fs=>{zusatz=zusatz.concat(fs);$('#listZ').innerHTML=zusatz.map(f=>`<div><span>${f.name}</span><span>${mb(f.size)}</span></div>`).join('')});
function put(url,file,onProg){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',url);x.upload.onprogress=e=>onProg&&onProg(e.loaded/e.total);x.onload=()=>x.status<300?res(JSON.parse(x.responseText)):rej(new Error(x.responseText||x.status));x.onerror=()=>rej(new Error('Netzwerkfehler'));x.send(file)})}
// Laenge eines Videos im Browser messen (nur fuer die Bestaetigung, 0 wenn es nicht klappt).
const dauer=f=>new Promise(r=>{try{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';const fertig=d=>{URL.revokeObjectURL(u);r(d)};v.onloadedmetadata=()=>fertig(isFinite(v.duration)?v.duration:0);v.onerror=()=>fertig(0);setTimeout(()=>fertig(0),8000);v.src=u}catch{r(0)}});
const minSek=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const artJetzt=()=>(document.querySelector('input[name=art]:checked')||{}).value||'reel';
$('#senden').onclick=async()=>{
  if(!videos.length)return; const btn=$('#senden'); btn.disabled=true; $('#err').textContent=''; $('#ok').hidden=true; const bar=$('#bar'); bar.hidden=false; const fill=bar.querySelector('i');
  const art=artJetzt(), mitZusatz=art!=='heute';
  // Bei mehreren Teilen 01-, 02- … voranstellen: die Reihenfolge der Liste gilt, nicht das Dateisystem.
  const teile=videos.map((f,i)=>({f,name:videos.length>1?String(i+1).padStart(2,'0')+'-'+f.name:f.name}));
  const beilagen=mitZusatz?zusatz:[];
  const q=`key=${encodeURIComponent(KEY)}`;
  try{
    const meta=await fetch('/api/upload-paket?'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:videos[0].name,teile:teile.map(t=>t.name),erwartet:[...teile.map(t=>({name:t.name,art:'video',bytes:t.f.size})),...beilagen.map(f=>({name:f.name,art:'zusatz',bytes:f.size}))],art,notizen:mitZusatz?$('#notizen').value:'',absender:$('#absender').value,zusatz:beilagen.map(f=>f.name)})}).then(r=>r.json());
    if(!meta.ok)throw new Error(meta.error||'Paket konnte nicht angelegt werden');
    const total=teile.reduce((a,t)=>a+t.f.size,0)+beilagen.reduce((a,f)=>a+f.size,0); let done=0;
    const datei=async(f,name,wie)=>{
      // Ein Abbruch mitten in der Lieferung soll nicht alles kosten: jede Datei bekommt drei Versuche.
      for(let v=1;;v++){
        try{await put(`/api/upload-paket/datei?${q}&paket=${encodeURIComponent(meta.id)}&art=${wie}&name=${encodeURIComponent(name)}`,f,p=>fill.style.width=((done+p*f.size)/total*100)+'%');break}
        catch(e){if(v>=3||/zu gross|groesser/i.test(e.message))throw e; await new Promise(r=>setTimeout(r,4000*v))}
      }
      done+=f.size;
    };
    const laengen=Promise.all(teile.map(t=>dauer(t.f)));
    for(const t of teile) await datei(t.f,t.name,'video');
    for(const f of beilagen) await datei(f,f.name,'zusatz');
    // Die Bestaetigung kommt vom Server: er vergleicht, was angekuendigt war, mit dem, was da ist.
    const fertigMelden=()=>fetch(`/api/upload-paket/fertig?${q}&paket=${encodeURIComponent(meta.id)}`,{method:'POST'}).then(r=>r.json());
    let ende=await fertigMelden();
    if(ende&&ende.fehlt&&ende.fehlt.length){            // einmal nachschicken, was fehlt
      for(const x of ende.fehlt){const t=teile.find(t=>t.name===x.name)||{f:beilagen.find(f=>f.name===x.name),name:x.name}; if(t.f){done=Math.max(0,done-t.f.size); await datei(t.f,t.name,x.art)}}
      ende=await fertigMelden();
    }
    if(ende&&ende.fehlt&&ende.fehlt.length){
      bar.hidden=true;
      $('#err').innerHTML=HINWEIS(`<b>Nicht alles ist angekommen.</b> ${(ende.angekommen||[]).filter(a=>a.art==='video').length} von ${teile.length} Videos sind da. Es fehlt:<br>${ende.fehlt.map(x=>'· '+esc(x.name)+' — '+esc(x.grund)).join('<br>')}<br>Bitte auf „Hochladen" tippen und es noch einmal schicken. Die Lieferung wird erst verarbeitet, wenn alles da ist.`,'rot');
      btn.disabled=false; return;
    }
    if(ende&&ende.error)throw new Error(ende.error);
    const sek=(await laengen).reduce((a,d)=>a+d,0);
    const da=(ende.angekommen||[]).filter(a=>a.art==='video');
    fill.style.width='100%'; $('#ok').hidden=false;
    const liste=da.length?'<br>'+da.map(a=>'✓ '+esc(a.name)+' · '+mb(a.bytes)).join('<br>'):'';
    $('#ok').innerHTML=`<b>Angekommen: ${da.length||teile.length} von ${teile.length} ${teile.length>1?'Videos':'Video'}${sek?' · '+minSek(sek)+' Min.':''}</b>${beilagen.length?' + '+beilagen.length+' Zusatzdatei(en)':''}${liste}<br>${teile.length>1?'Die Teile werden zu einem Beitrag verbunden. ':''}${art==='heute'?'Die Story bekommt jetzt Untertitel und geht in wenigen Minuten online.':art==='story'?'Liegt in der Story-Planung.':'Liegt im Eingang und wird verarbeitet.'} Danke!`;
    videos=[]; zusatz=[]; $('#listV').innerHTML=''; $('#listZ').innerHTML=''; $('#notizen').value='';
  }catch(e){let m=e.message;try{m=JSON.parse(m).error||m}catch{};$('#err').textContent='Fehler: '+m; btn.disabled=false}
};
</script>
</body></html>
